<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replione Admin – Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <a href="index.html" class="logo">
            <img src="/css/replione_logo.png" alt="Replione"> <small>Admin</small>
        </a>
        <nav class="desktop-navigation">
            <a href="index.html" class="active">Bestellungen</a>
            <a href="users.html" id="navUsers">Kunden</a>
            <a href="#" id="adminLogoutBtn">Logout</a>
        </nav>
        <div class="header-actions">
            <button class="burger-button" id="burgerButton" data-menu-toggle>
                <span class="burger-icon">
                    <span></span><span></span><span></span>
                </span>
            </button>
        </div>
    </div>
</header>

<div class="mobile-menu" id="mobileMenu" data-side-menu>
    <div class="mobile-menu-header">
        <strong>Admin Menü</strong>
        <button class="mobile-menu-close" id="mobileMenuClose">✕</button>
    </div>
    <nav>
        <a href="index.html">Bestellungen</a>
        <a href="users.html">Kunden</a>
        <a href="#" id="adminLogoutBtnMobile">Logout</a>
    </nav>
</div>
<div class="menu-overlay" id="menuOverlay" data-menu-overlay></div>

<main class="admin-main">
    <section class="page-header">
        <div class="eyebrow">Dashboard</div>
        <h1>Bestellübersicht</h1>
    </section>

    <section class="admin-stats" id="adminStats">
        <div class="stat-card"><h3>Neue Bestellungen</h3><strong id="statNew">0</strong></div>
        <div class="stat-card"><h3>In Bearbeitung</h3><strong id="statProgress">0</strong></div>
        <div class="stat-card"><h3>Unterwegs</h3><strong id="statShipped">0</strong></div>
        <div class="stat-card"><h3>Abgeschlossen</h3><strong id="statDone">0</strong></div>
        <div class="stat-card"><h3>Zahlung offen</h3><strong id="statUnpaid">0</strong></div>
    </section>

    <section class="admin-filters">
        <input type="text" id="orderSearch" placeholder="Suche (Name, E-Mail, ID)..." class="admin-input">
        <select id="orderStatusFilter" class="admin-select">
            <option value="">Alle Status</option>
            <option value="Eingegangen">Eingegangen</option>
            <option value="In Bearbeitung">In Bearbeitung</option>
            <option value="Bestellt">Bestellt</option>
            <option value="Unterwegs">Unterwegs</option>
            <option value="Abgeschlossen">Abgeschlossen</option>
            <option value="Storniert">Storniert</option>
        </select>
    </section>

    <section class="orders-table-wrapper">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Kunde</th>
                    <th>Datum</th>
                    <th>Status</th>
                    <th>Zahlung</th>
                    <th>Aktionen</th>
                </tr>
            </thead>
            <tbody id="ordersTbody">
                <tr><td colspan="6" style="text-align: center;">Lade Bestellungen...</td></tr>
            </tbody>
        </table>
    </section>
</main>

<div class="modal-overlay" id="orderModal" hidden>
    <div class="modal-content">
        <div class="modal-header">
            <h2>Bestelldetails</h2>
            <button class="modal-close" id="closeOrderModal">✕</button>
        </div>
        <div class="modal-body" id="orderModalBody">
            <!-- Dynamisch -->
        </div>
    </div>
</div>

<div class="modal-overlay" id="contactModal" hidden>
    <div class="modal-content">
        <div class="modal-header">
            <h2>Kunden kontaktieren</h2>
            <button class="modal-close" id="closeContactModal">✕</button>
        </div>
        <div class="modal-body">
            <form id="contactForm">
                <input type="hidden" id="contactOrderId">
                <div class="form-group">
                    <label>Betreff</label>
                    <input type="text" id="contactSubject" required>
                </div>
                <div class="form-group">
                    <label>Nachricht</label>
                    <textarea id="contactMessage" rows="5" required></textarea>
                </div>
                <div id="contactMessageAlert" class="form-message" hidden></div>
                <div class="form-actions" style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px;">
                    <button type="button" class="button button-secondary" id="cancelContactModal">Abbrechen</button>
                    <button type="submit" class="button button-primary">E-Mail senden</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="/js/navigation.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
