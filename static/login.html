<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replione – Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header class="site-header">
    <div class="header-inner">

        <a href="/" class="logo">
            <img src="/css/replione_logo.png" alt="Replione">
        </a>

        <nav class="desktop-navigation">
            <a href="index.html">Startseite</a>
            <a href="bestellen.html">Bestellen</a>
            <a href="bestellungen.html">Meine Bestellungen</a>
        </nav>

        <div class="header-actions">

            <a href="warenkorb.html" class="cart-button">
                <span class="cart-icon">🛒</span>
                <span class="cart-count" data-cart-count>0</span>
            </a>

            <a href="account.html" class="account-button">
                <span class="user-icon">👤</span>
            </a>

            <button class="burger-button" id="burgerButton" data-menu-toggle>
                <span class="burger-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            </button>

        </div>

    </div>
</header>


<div class="mobile-menu" id="mobileMenu" data-side-menu>

    <div class="mobile-menu-header">
        <strong>Menü</strong>
        <button class="mobile-menu-close" id="mobileMenuClose">✕</button>
    </div>

    <nav>
        <a href="index.html">Startseite</a>
        <a href="bestellen.html">Bestellen</a>
        <a href="warenkorb.html">Warenkorb</a>
        <a href="bestellungen.html">Meine Bestellungen</a>
        <a href="account.html">Mein Konto</a>
    </nav>

</div>

<div class="menu-overlay" id="menuOverlay" data-menu-overlay></div>


<main>

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-heading">

            <div class="eyebrow">Mein Konto</div>

            <h1 id="authTitle">
                Willkommen zurück
            </h1>

            <p id="authSubtitle">
                Melde dich an, um deine Bestellungen zu verwalten.
            </p>

        </div>


        <!-- LOGIN -->

        <form id="loginForm" data-auth-form="login">

            <div class="form-group">

                <label for="loginEmail">
                    E-Mail-Adresse
                </label>

                <input
                    type="email"
                    id="loginEmail" name="email"
                    required
                    placeholder="deine@email.de"
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Passwort
                </label>

                <input
                    type="password"
                    id="loginPassword" name="password"
                    required
                    placeholder="••••••••"
                >

            </div>


            <button type="submit" class="button button-primary button-full">
                Anmelden
            </button>

        </form>


        <!-- REGISTER -->

        <form id="registerForm" data-auth-form="register" hidden>

            <div class="form-group">

                <label for="registerName">
                    Name
                </label>

                <input
                    type="text"
                    id="registerName" name="name"
                    required
                    placeholder="Dein Name"
                >

            </div>


            <div class="form-group">

                <label for="registerEmail">
                    E-Mail-Adresse
                </label>

                <input
                    type="email"
                    id="registerEmail" name="email"
                    required
                    placeholder="deine@email.de"
                >

            </div>


            <div class="form-group">

                <label for="registerPassword">
                    Passwort
                </label>

                <input
                    type="password"
                    id="registerPassword" name="password"
                    required
                    placeholder="••••••••"
                >

            </div>


            <button type="submit" class="button button-primary button-full">
                Konto erstellen
            </button>

        </form>


        <div class="auth-switch">

            <span id="authSwitchText">
                Noch kein Konto?
            </span>

            <button type="button" id="authSwitchButton">
                Konto erstellen
            </button>

        </div>


        <div id="authMessage" class="form-message" data-auth-message hidden></div>

    </div>

</section>

</main>


<script src="/js/navigation.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/auth.js"></script>

</body>
</html>
