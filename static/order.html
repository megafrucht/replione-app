<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestellen — Replione</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
    <a href="/" class="logo">repl<span>i</span>one</a>
    <nav class="desktop-nav">
        <a href="/" class="nav-button">Startseite</a>
        <a href="/order.html" class="nav-button primary">Bestellen</a>
        <a href="/orders.html" class="nav-button">Meine Bestellungen</a>
        <a href="/account.html" id="navAccount" class="account-button">Konto</a>
    </nav>
</header>

<main class="order-page">
    <div class="order-heading">
        <h1>Bestellung aufgeben</h1>
        <p>Gib die Produktdetails ein und sende deinen Auftrag ab.</p>
    </div>

    <div class="order-box">
        <div class="form-group">
            <label for="link">Litbuy Produktlink (optional)</label>
            <input id="link" type="url" placeholder="https://litbuy.com/...">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="size">Größe</label>
                <input id="size" type="text" placeholder="z. B. L, XL oder 43">
            </div>
            <div class="form-group">
                <label for="color">Farbe</label>
                <input id="color" type="text" placeholder="z. B. Schwarz / Weiß">
            </div>
        </div>
        <div class="form-group">
            <label for="notes">Spezielle Wünsche / Notizen</label>
            <textarea id="notes" placeholder="z. B. Farbcode oder spezifische Variante..."></textarea>
        </div>
        <button id="submitBtn" class="button button-yellow" style="width:100%;" onclick="submitOrder()">Bestellung absenden</button>
    </div>
</main>

<div id="toast" class="toast"></div>
<footer>replione · Produktbestellungen über Litbuy</footer>
<script src="/js/app.js"></script>
<script>
async function submitOrder() {
    const size = document.getElementById("size").value.trim();
    const color = document.getElementById("color").value.trim();
    const link = document.getElementById("link").value.trim();
    const notes = document.getElementById("notes").value.trim();

    if (!size || !color) return showToast("Bitte gib mindestens Größe und Farbe an.");

    if (!currentUser) {
        showToast("Bitte melde dich zuerst an.");
        setTimeout(() => window.location.href = "/account.html", 700);
        return;
    }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Wird übermittelt...";

    try {
        const res = await fetch("/api/orders", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                items: [{ link, size, color, notes }]
            })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Fehler beim Absenden.");

        showToast("Bestellung erfolgreich aufgegeben!");
        setTimeout(() => window.location.href = "/orders.html", 800);
    } catch (e) {
        showToast(e.message);
        btn.disabled = false;
        btn.textContent = "Bestellung absenden";
    }
}
</script>
</body>
</html>
