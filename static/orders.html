<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Bestellungen — Replione</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
    <a href="/" class="logo">repl<span>i</span>one</a>
    <nav class="desktop-nav">
        <a href="/" class="nav-button">Startseite</a>
        <a href="/order.html" class="nav-button">Bestellen</a>
        <a href="/account.html" class="account-button">Konto</a>
        <button class="cart-button" onclick="openCart()" aria-label="Warenkorb">
            <span class="cart-icon">🛒</span>
            <span id="headerCartBadge" class="cart-badge">0</span>
        </button>
    </nav>
    <button id="mobileMenuButton" class="mobile-menu-button" onclick="toggleMobileMenu()" aria-label="Menü">
        <span></span><span></span><span></span>
    </button>
</header>

<div id="mobileMenu" class="mobile-menu">
    <a href="/">Startseite</a>
    <a href="/order.html">Bestellen</a>
    <a href="/orders.html">Meine Bestellungen</a>
    <a href="/account.html">Konto</a>
    <button onclick="toggleMobileMenu(); openCart();">🛒 Warenkorb <span id="mobileCartCount">(0)</span></button>
</div>

<main class="orders-page">
    <div class="order-heading">
        <h1>Meine Bestellungen</h1>
        <p>Hier siehst du den aktuellen Stand deiner Bestellungen.</p>
    </div>

    <div id="ordersContainer">
        <div class="empty-orders">Lade deine Bestellungen …</div>
    </div>
</main>

<div id="cartModal" class="modal-overlay" onclick="closeCartOutside(event)">
    <div class="modal">
        <div class="modal-header">
            <h2>Warenkorb</h2>
            <button class="close-button" onclick="closeCart()">×</button>
        </div>
        <div id="modalCartItems"></div>
        <a href="/order.html" class="button button-yellow" style="width:100%; margin-top:20px;">Bestellung prüfen</a>
    </div>
</div>

<div id="toast" class="toast"></div>

<footer>replione · Produktbestellungen über Litbuy</footer>

<script src="/js/app.js"></script>
<script>
async function onUserLoaded() {
    const container = document.getElementById("ordersContainer");
    if (!currentUser) {
        container.innerHTML = `
            <div class="empty-orders">
                Bitte melde dich an, um deine Bestellungen zu sehen.<br><br>
                <a href="/account.html" class="button button-yellow">Zum Konto</a>
            </div>
        `;
        return;
    }

    try {
        const res = await apiFetch("/orders/my");
        if (!res.ok) throw new Error(await getErrorMessage(res));
        const data = await res.json();
        renderOrders(data.orders || []);
    } catch (err) {
        container.innerHTML = `
            <div class="empty-orders">
                Bestellungen konnten nicht geladen werden.<br><br>
                <small>${escapeHTML(err.message || "")}</small>
            </div>
        `;
    }
}

function renderOrders(orders) {
    const container = document.getElementById("ordersContainer");
    if (!orders.length) {
        container.innerHTML = `
            <div class="empty-orders">
                Du hast noch keine Bestellungen.<br><br>
                <a href="/order.html" class="button button-yellow">Jetzt bestellen</a>
            </div>
        `;
        return;
    }

    const list = document.createElement("div");
    list.className = "order-list";
    orders.forEach(o => {
        const card = document.createElement("div");
        card.className = "order-card";
        const date = o.created_at ? new Date(o.created_at).toLocaleDateString("de-DE") : "—";
        card.innerHTML = `
            <div class="order-card-top">
                <div>
                    <div class="order-number">${escapeHTML(o.order_number)}</div>
                    <div class="order-date">${escapeHTML(date)}</div>
                </div>
                <div class="order-status">${escapeHTML(o.status || "Eingegangen")}</div>
            </div>
            <div class="order-card-products">
                ${o.item_count} ${o.item_count === 1 ? "Produkt" : "Produkte"}
            </div>
        `;
        list.appendChild(card);
    });
    container.innerHTML = "";
    container.appendChild(list);
}
</script>
</body>
</html>
